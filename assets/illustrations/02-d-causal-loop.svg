<text x="860.0" y="308.0" fill="#8a4f9e" font-size="15" text-anchor="middle" font-weight="400">行動が未来の状況を成立させる</text>
<text x="860.0" y="588.0" fill="#8a4f9e" font-size="15" text-anchor="middle" font-weight="400">働きかけが過去の行動を促す</text>
<text x="865.0" y="445.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">閉じた輪</text>
<text x="855.0" y="672.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">過去の書き換えではなく、働きかけを含めて成立した歴史</text>
<text x="50.0" y="712.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">紫＝物語の出来事、実線＝因果</text>
