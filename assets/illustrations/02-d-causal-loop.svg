<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">未来のエレンと過去のグリシャの輪</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">過去から未来へ一方向に進む因果の連鎖と、グリシャの行動とエレンの働きかけが互いに依存して閉じる輪を並べて見る。</text>
