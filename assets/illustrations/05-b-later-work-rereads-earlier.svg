<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">後の作品が先の作品を読み替える</title>
<desc id="desc">千年前の文章と現代の小説のあいだで往復する二本の矢印と、後続作品を先に読んだ読者の視線を見る。</desc>
<defs><marker id="arrow-2f8f83" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     05     図5-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">後の作品が先の作品を読み替える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">千年前の文章と現代の小説のあいだで往復する二本の矢印と、後続作品を先に読んだ読者の視線を見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="130.0" y="230.0" width="300.0" height="110.0" rx="14" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="280.0" y="281.0" fill="#8a4f9e" font-size="22" text-anchor="middle" font-weight="700">『枕草子』</text>
<text x="280.0" y="311.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">先行作品</text>
<rect x="770.0" y="230.0" width="300.0" height="110.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="920.0" y="281.0" fill="#c7792b" font-size="22" text-anchor="middle" font-weight="700">現代の小説</text>
<text x="920.0" y="311.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">後続作品</text>
<line x1="444.0" y1="262.0" x2="756.0" y2="262.0" stroke="#2f8f83" stroke-width="2.4" marker-end="url(#arrow-2f8f83)"/>
<text x="600.0" y="248.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">影響（成立条件）</text>
<line x1="756.0" y1="312.0" x2="444.0" y2="312.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-2b5f9e)" stroke-dasharray="8 7"/>
<text x="600.0" y="336.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">読み替え（新しい意味）</text>
<text x="130.0" y="376.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">原文は変わらない。変わるのは解釈</text>
<circle cx="600.0" cy="503.0" r="11.399999999999999" fill="#2b5f9e"/>
<ellipse cx="600.0" cy="535.3" rx="10.4" ry="22.8" transform="rotate(-0 600.0 535.3)" fill="#2b5f9e"/>
<line x1="600.0" y1="556.2" x2="579.1" y2="592.3" stroke="#2b5f9e" stroke-width="7.6" stroke-linecap="round"/>
<line x1="600.0" y1="556.2" x2="622.8" y2="586.6" stroke="#2b5f9e" stroke-width="7.6" stroke-linecap="round"/>
<line x1="603.8" y1="523.9" x2="579.1" y2="541.0" stroke="#2b5f9e" stroke-width="6.2" stroke-linecap="round"/>
<line x1="603.8" y1="523.9" x2="624.7" y2="516.3" stroke="#2b5f9e" stroke-width="6.2" stroke-linecap="round"/>
<text x="600.0" y="626.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">読者</text>
