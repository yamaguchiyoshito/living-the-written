<text x="718.0" y="440.0" fill="#2b5f9e" font-size="16" text-anchor="start" font-weight="400">先に読む</text>
<line x1="588.0" y1="488.0" x2="420.0" y2="356.0" stroke="#2b5f9e" stroke-width="2" marker-end="url(#arrow-2b5f9e)" stroke-dasharray="8 7"/>
<text x="484.0" y="440.0" fill="#2b5f9e" font-size="16" text-anchor="end" font-weight="400">後から開く</text>
</g>
