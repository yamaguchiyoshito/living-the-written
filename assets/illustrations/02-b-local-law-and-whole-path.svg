<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">各時点の法則と経路全体の条件</title>
<desc id="desc">運動を時点ごとに決める記述と、出発から到着までの経路全体に条件を課す記述を並べ、両者が対応することを見る。</desc>
<defs><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     02     図2-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">各時点の法則と経路全体の条件</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">運動を時点ごとに決める記述と、出発から到着までの経路全体に条件を課す記述を並べ、両者が対応することを見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="50.0" y="200.0" width="490.0" height="380.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="295.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">各時点で成り立つ法則</text>
<rect x="85.0" y="335.0" width="100.0" height="58.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="135.0" y="372.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">ある時点</text>
<rect x="235.0" y="335.0" width="100.0" height="58.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="285.0" y="372.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">次の時点</text>
<rect x="385.0" y="335.0" width="100.0" height="58.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="435.0" y="372.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">その次</text>
<line x1="189.0" y1="364.0" x2="231.0" y2="364.0" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<line x1="339.0" y1="364.0" x2="381.0" y2="364.0" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<line x1="489.0" y1="364.0" x2="527.0" y2="364.0" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<text x="135.0" y="317.0" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="400">位置と速度と力</text>
<text x="210.0" y="419.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">次の時点を決める</text>
<line x1="100.0" y1="500.0" x2="490.0" y2="500.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="100.0" cy="500.0" r="6" fill="#232a33"/>
<circle cx="490.0" cy="500.0" r="6" fill="#232a33"/>
<text x="100.0" y="530.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">出発の時刻</text>
<text x="490.0" y="530.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">到着の時刻</text>
<line x1="600.0" y1="445.0" x2="552.0" y2="445.0" stroke="#2b5f9e" stroke-width="2" marker-end="url(#arrow-2b5f9e)" stroke-dasharray="8 7"/>
<line x1="600.0" y1="445.0" x2="648.0" y2="445.0" stroke="#2b5f9e" stroke-width="2" marker-end="url(#arrow-2b5f9e)" stroke-dasharray="8 7"/>
<text x="600.0" y="420.0" fill="#2b5f9e" font-size="15" text-anchor="middle" font-weight="400">数学的に</text>
<text x="600.0" y="475.0" fill="#2b5f9e" font-size="15" text-anchor="middle" font-weight="400">対応する</text>
<rect x="660.0" y="200.0" width="490.0" height="380.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="905.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">経路全体に課した条件</text>
<rect x="710.0" y="270.0" width="390.0" height="36.0" rx="8" fill="#2b5f9e" stroke="none" stroke-width="0" opacity="0.14"/>
<text x="905.0" y="294.0" fill="#2b5f9e" font-size="15" text-anchor="middle" font-weight="400">出発から到着まで足し合わせた量　→　一次変分がゼロ</text>
<path d="M 710 440 C 820 330, 980 520, 1100 400" fill="none" stroke="#2b5f9e" stroke-width="3"/>
<path d="M 710 440 C 800 355, 1010 480, 1100 400" fill="none" stroke="#2b5f9e" stroke-width="1.6" stroke-dasharray="8 7"/>
<text x="820.0" y="362.0" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="700">実際の経路</text>
<text x="1000.0" y="478.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">わずかにずらした経路</text>
<line x1="710.0" y1="500.0" x2="1100.0" y2="500.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="710.0" cy="440.0" r="6" fill="#232a33"/>
<circle cx="1100.0" cy="400.0" r="6" fill="#232a33"/>
<line x1="710.0" y1="448.0" x2="710.0" y2="500.0" stroke="#d8d4c8" stroke-width="1.2" stroke-dasharray="8 7"/>
<line x1="1100.0" y1="408.0" x2="1100.0" y2="500.0" stroke="#d8d4c8" stroke-width="1.2" stroke-dasharray="8 7"/>
<text x="710.0" y="530.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">出発の時刻</text>
<text x="1100.0" y="530.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">到着の時刻</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">黒丸＝固定した端点。実線＝実際の経路、破線＝わずかにずらした経路</text>
</g>
</svg>
