<text x="880.0" y="296.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">読む行為は省略できない。</text>
<text x="880.0" y="330.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400"></text>
<text x="880.0" y="364.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">未来が決まっていても、</text>
<text x="880.0" y="398.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">その未来はまだ</text>
<text x="880.0" y="432.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">経験されていない。</text>
<text x="600.0" y="634.0" fill="#2b5f9e" font-size="28" text-anchor="middle" font-weight="700">すべてが決まっていたとしても、すべてはまだ生きられていない。</text>
<text x="50.0" y="672.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">時間、因果、自由、記憶、物語、虚構、持続。七つの問いを八回でたどる。</text>
