<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">書かれたものを生きる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">時間・因果・自由・記憶・物語・虚構・持続の哲学、全8回</text>
