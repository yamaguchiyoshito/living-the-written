<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">時間をめぐる三つの問題</title>
<desc id="desc">出来事の順序、物理的な非対称、経験される流れを三つの列に分け、それぞれが別の問題であることを見る。</desc>
<defs><marker id="arrow-232a33" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#232a33" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     01     図1-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">時間をめぐる三つの問題</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">出来事の順序、物理的な非対称、経験される流れを三つの列に分け、それぞれが別の問題であることを見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="225.0" y="216.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">第一</text>
<text x="225.0" y="248.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">順序がある</text>
<text x="225.0" y="276.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">出来事に先後の並びがあるか</text>
<text x="600.0" y="216.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">第二</text>
<text x="600.0" y="248.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">非対称がある</text>
<text x="600.0" y="276.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">過去と未来に物理的な違いがあるか</text>
<text x="975.0" y="216.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">第三</text>
<text x="975.0" y="248.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">流れて感じる</text>
<text x="975.0" y="276.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">時間の流れをどう経験するか</text>
<line x1="412.0" y1="206.0" x2="412.0" y2="540.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="787.0" y1="206.0" x2="787.0" y2="540.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="105.0" y1="362.0" x2="345.0" y2="362.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="105.0" cy="362.0" r="9" fill="#232a33"/>
<circle cx="165.0" cy="362.0" r="9" fill="#232a33"/>
<circle cx="225.0" cy="362.0" r="9" fill="#232a33"/>
<circle cx="285.0" cy="362.0" r="9" fill="#232a33"/>
<circle cx="345.0" cy="362.0" r="9" fill="#232a33"/>
<text x="105.0" y="400.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">先</text>
<text x="345.0" y="400.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">後</text>
<text x="225.0" y="486.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">出来事が先後に並ぶ</text>
<circle cx="482.0" cy="322.0" r="5" fill="#232a33"/>
<circle cx="482.0" cy="340.0" r="5" fill="#232a33"/>
<circle cx="482.0" cy="358.0" r="5" fill="#232a33"/>
<circle cx="500.0" cy="322.0" r="5" fill="#232a33"/>
<circle cx="500.0" cy="340.0" r="5" fill="#232a33"/>
<circle cx="500.0" cy="358.0" r="5" fill="#232a33"/>
<circle cx="518.0" cy="322.0" r="5" fill="#232a33"/>
<circle cx="518.0" cy="340.0" r="5" fill="#232a33"/>
<circle cx="518.0" cy="358.0" r="5" fill="#232a33"/>
<circle cx="668.0" cy="318.0" r="5" fill="#232a33"/>
<circle cx="702.0" cy="306.0" r="5" fill="#232a33"/>
<circle cx="735.0" cy="328.0" r="5" fill="#232a33"/>
<circle cx="680.0" cy="352.0" r="5" fill="#232a33"/>
<circle cx="718.0" cy="345.0" r="5" fill="#232a33"/>
<circle cx="745.0" cy="364.0" r="5" fill="#232a33"/>
<circle cx="662.0" cy="374.0" r="5" fill="#232a33"/>
<circle cx="700.0" cy="380.0" r="5" fill="#232a33"/>
<circle cx="732.0" cy="392.0" r="5" fill="#232a33"/>
<line x1="538.0" y1="340.0" x2="648.0" y2="340.0" stroke="#232a33" stroke-width="2.5" marker-end="url(#arrow-232a33)"/>
<text x="500.0" y="422.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">エントロピー低</text>
<text x="703.0" y="422.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">エントロピー高</text>
<text x="600.0" y="486.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">一方向にしか進まない</text>
<text x="600.0" y="516.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">すべてを認識の産物とは言えない</text>
<rect x="835.0" y="376.0" width="125.0" height="34.0" rx="17.0" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.75"/>
<rect x="990.0" y="376.0" width="125.0" height="34.0" rx="17.0" fill="#2b5f9e" stroke="none" stroke-width="0" opacity="0.28"/>
<rect x="957.0" y="292.0" width="36.0" height="140.0" rx="8" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.22"/>
<line x1="975.0" y1="296.0" x2="975.0" y2="428.0" stroke="#c7792b" stroke-width="3"/>
<circle cx="975.0" cy="310.0" r="8.399999999999999" fill="#2f8f83"/>
<ellipse cx="975.0" cy="333.8" rx="7.7" ry="16.8" transform="rotate(-0 975.0 333.8)" fill="#2f8f83"/>
<line x1="975.0" y1="349.2" x2="959.6" y2="375.8" stroke="#2f8f83" stroke-width="5.6" stroke-linecap="round"/>
<line x1="975.0" y1="349.2" x2="991.8" y2="371.6" stroke="#2f8f83" stroke-width="5.6" stroke-linecap="round"/>
<line x1="977.8" y1="325.4" x2="959.6" y2="338.0" stroke="#2f8f83" stroke-width="4.5" stroke-linecap="round"/>
<line x1="977.8" y1="325.4" x2="993.2" y2="319.8" stroke="#2f8f83" stroke-width="4.5" stroke-linecap="round"/>
<text x="897.0" y="366.0" fill="#8a4f9e" font-size="17" text-anchor="middle" font-weight="700">過去</text>
<text x="1052.0" y="366.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">未来</text>
<text x="975.0" y="452.0" fill="#c7792b" font-size="17" text-anchor="middle" font-weight="700">現在</text>
<text x="975.0" y="486.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">「現在」が移っていくと感じる</text>
<text x="975.0" y="516.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">世界の性質か、意識の構造か</text>
<text x="600.0" y="566.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">三つは別の問題であり、混ぜると議論は進まなくなる</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">川は水が場所を移る。時間は何に対して移るのか。</text>
</g>
</svg>
