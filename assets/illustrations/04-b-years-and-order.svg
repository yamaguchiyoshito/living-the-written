<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">歴史の年代と経験の順序は別の軸である</title>
<desc id="desc">同じ三つの年が歴史の軸と経験の軸で異なる順に並び、対応線が交差する様子を見る。</desc>
<defs><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-2f8f83" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><marker id="arrow-8a4f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a4f9e" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     04     図4-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">歴史の年代と経験の順序は別の軸である</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">同じ三つの年が歴史の軸と経験の軸で異なる順に並び、対応線が交差する様子を見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="120.0" y="258.0" fill="#2b5f9e" font-size="19" text-anchor="start" font-weight="700">歴史の年代</text>
<line x1="120.0" y1="270.0" x2="1020.0" y2="270.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-2b5f9e)"/>
<line x1="340.0" y1="263.0" x2="340.0" y2="277.0" stroke="#2b5f9e" stroke-width="2"/>
<text x="340.0" y="256.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">1960</text>
<line x1="600.0" y1="263.0" x2="600.0" y2="277.0" stroke="#2b5f9e" stroke-width="2"/>
<text x="600.0" y="256.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">1985</text>
<line x1="860.0" y1="263.0" x2="860.0" y2="277.0" stroke="#2b5f9e" stroke-width="2"/>
<text x="860.0" y="256.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">2020</text>
<line x1="340.0" y1="280.0" x2="340.0" y2="460.0" stroke="#5d6873" stroke-width="1.6" stroke-dasharray="8 7"/>
<line x1="600.0" y1="280.0" x2="860.0" y2="460.0" stroke="#5d6873" stroke-width="1.6" stroke-dasharray="8 7"/>
<line x1="860.0" y1="280.0" x2="600.0" y2="460.0" stroke="#5d6873" stroke-width="1.6" stroke-dasharray="8 7"/>
<text x="120.0" y="458.0" fill="#2f8f83" font-size="19" text-anchor="start" font-weight="700">ヒカリの経験の順序</text>
<line x1="120.0" y1="470.0" x2="1020.0" y2="470.0" stroke="#2f8f83" stroke-width="2.4" marker-end="url(#arrow-2f8f83)"/>
<line x1="340.0" y1="463.0" x2="340.0" y2="477.0" stroke="#2f8f83" stroke-width="2"/>
<text x="340.0" y="500.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">1番目</text>
<text x="340.0" y="524.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">1960</text>
<line x1="600.0" y1="463.0" x2="600.0" y2="477.0" stroke="#2f8f83" stroke-width="2"/>
<text x="600.0" y="500.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">2番目</text>
<text x="600.0" y="524.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">2020</text>
<line x1="860.0" y1="463.0" x2="860.0" y2="477.0" stroke="#2f8f83" stroke-width="2"/>
<text x="860.0" y="500.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">3番目</text>
<text x="860.0" y="524.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">1985</text>
<rect x="602.0" y="402.0" width="256.0" height="26.0" rx="6" fill="#f7f5ef" stroke="none" stroke-width="0"/>
<text x="730.0" y="421.0" fill="#8a4f9e" font-size="15" text-anchor="middle" font-weight="700">2020年の記憶を持って1985年へ</text>
<path d="M 612 458 Q 730 400 846 458" fill="none" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow-8a4f9e)"/>
<line x1="340.0" y1="560.0" x2="890.0" y2="560.0" stroke="#2f8f83" stroke-width="2.4" marker-end="url(#arrow-2f8f83)"/>
<text x="615.0" y="590.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">経験は順に積み重なる</text>
<text x="1150.0" y="375.0" fill="#232a33" font-size="17" text-anchor="end" font-weight="700">二つの順序は一致しない</text>
</g>
</svg>
