<text x="786.0" y="286.0" fill="#8a4f9e" font-size="16" text-anchor="start" font-weight="700">小説</text>
<rect x="790.0" y="298.0" width="190.0" height="62.0" rx="14" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="885.0" y="337.0" fill="#8a4f9e" font-size="19" text-anchor="middle" font-weight="700">二十歳の浜崎正</text>
<rect x="770.0" y="470.0" width="230.0" height="62.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="885.0" y="509.0" fill="#c7792b" font-size="19" text-anchor="middle" font-weight="700">現在の浜崎正（書く）</text>
<line x1="860.0" y1="378.0" x2="860.0" y2="464.0" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow-8a4f9e)"/>
<text x="846.0" y="427.0" fill="#232a33" font-size="15" text-anchor="end" font-weight="400">過去が書き手をつくる</text>
<line x1="910.0" y1="466.0" x2="910.0" y2="380.0" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-c7792b)" stroke-dasharray="8 7"/>
<text x="924.0" y="427.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">現在が過去を物語にする</text>
