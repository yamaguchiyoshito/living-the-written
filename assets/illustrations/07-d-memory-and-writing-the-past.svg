<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">過去は現在に残り、現在が過去を成立させる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">記憶論では過去から現在へ、作品では現在から過去へと向きが逆になる二つの矢印と、両者が重なる点を見る。</text>
