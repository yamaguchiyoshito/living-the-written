<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">逐次的認識と同時的認識</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">過去を記憶し未来を予測する逐次的認識と、出来事の全体を既知として持つ同時的認識を、二本の時間帯で対照する。</text>
