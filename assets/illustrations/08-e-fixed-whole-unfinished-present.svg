<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">確定した全体と未完了の現在</title>
<desc id="desc">同じ人生を、上では確定した全体として、下では現在から先が未完了のものとして見る。</desc>
<defs><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="590" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     08     図8-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">確定した全体と未完了の現在</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">同じ人生を、上では確定した全体として、下では現在から先が未完了のものとして見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="600.0" y="232.0" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="400">［全体として捉える観点］</text>
<rect x="120.0" y="258.0" width="960.0" height="32.0" rx="6" fill="#2b5f9e" stroke="#2b5f9e" stroke-width="1.5" opacity="0.22"/>
<text x="600.0" y="281.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">人生の全体（確定）</text>
<text x="120.0" y="316.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">始まり</text>
<text x="1080.0" y="316.0" fill="#232a33" font-size="16" text-anchor="end" font-weight="400">終わり</text>
<line x1="600.0" y1="366.0" x2="600.0" y2="336.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<line x1="600.0" y1="366.0" x2="600.0" y2="396.0" stroke="#5d6873" stroke-width="1.8" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<text x="616.0" y="372.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">別の水準</text>
<line x1="120.0" y1="460.0" x2="1080.0" y2="460.0" stroke="#d8d4c8" stroke-width="2"/>
<rect x="120.0" y="446.0" width="316.0" height="28.0" rx="6" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.4"/>
<text x="280.0" y="465.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">経験済み</text>
<line x1="440.0" y1="416.0" x2="440.0" y2="506.0" stroke="#c7792b" stroke-width="3"/>
<text x="440.0" y="408.0" fill="#c7792b" font-size="18" text-anchor="middle" font-weight="700">現在</text>
<rect x="468.0" y="428.0" width="140.0" height="64.0" rx="10" fill="#f7f5ef" stroke="#2f8f83" stroke-width="2" stroke-dasharray="8 7"/>
<text x="538.0" y="456.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">まだ出会って</text>
<text x="538.0" y="476.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">いない人</text>
<rect x="620.0" y="428.0" width="140.0" height="64.0" rx="10" fill="#f7f5ef" stroke="#2f8f83" stroke-width="2" stroke-dasharray="8 7"/>
<text x="690.0" y="456.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">まだ交わして</text>
<text x="690.0" y="476.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">いない言葉</text>
<rect x="772.0" y="428.0" width="140.0" height="64.0" rx="10" fill="#f7f5ef" stroke="#2f8f83" stroke-width="2" stroke-dasharray="8 7"/>
<text x="842.0" y="456.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">まだ描き終えて</text>
<text x="842.0" y="476.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">いない作品</text>
<rect x="924.0" y="428.0" width="140.0" height="64.0" rx="10" fill="#f7f5ef" stroke="#2f8f83" stroke-width="2" stroke-dasharray="8 7"/>
<text x="994.0" y="456.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">まだ経験して</text>
<text x="994.0" y="476.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">いない喪失</text>
<text x="600.0" y="548.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="400">［現在進行形で経験する観点］</text>
</g>
