<rect x="50.0" y="200.0" width="535.0" height="320.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="317.5" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">『TENET』の逆行</text>
<rect x="615.0" y="200.0" width="535.0" height="320.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="882.5" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">ヒカリの移動</text>
