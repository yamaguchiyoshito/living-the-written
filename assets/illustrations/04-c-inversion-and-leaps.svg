<line x1="90.0" y1="380.0" x2="545.0" y2="380.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-2b5f9e)"/>
<text x="530.0" y="446.0" fill="#2f8f83" font-size="17" text-anchor="end" font-weight="700">逆行者</text>
<line x1="530.0" y1="460.0" x2="110.0" y2="460.0" stroke="#2f8f83" stroke-width="2.4" marker-end="url(#arrow-2f8f83)"/>
<text x="530.0" y="492.0" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">連続したまま方向が反転</text>
<text x="317.0" y="348.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">同じ出来事</text>
<line x1="655.0" y1="380.0" x2="1110.0" y2="380.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-2b5f9e)"/>
<line x1="720.0" y1="373.0" x2="720.0" y2="387.0" stroke="#2b5f9e" stroke-width="2"/>
