<text x="560.0" y="312.0" fill="#8a4f9e" font-size="16" text-anchor="start" font-weight="700">記憶として残る経験</text>
<text x="560.0" y="372.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">持続は止まらない</text>
