<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">完成は、持続の停止ではない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">完成の境界を越えても経験が記憶として続き、作品は別の関係へ、経験は次の行為へ流れていく形を見る。</text>
