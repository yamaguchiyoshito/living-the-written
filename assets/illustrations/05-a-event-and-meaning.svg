<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">出来事は動かず、意味が動く</title>
<desc id="desc">過去の出来事と現在のあいだを往復する二本の矢印と、同じ出来事に付く二つの意味の札を見る。</desc>
<defs><marker id="arrow-2f8f83" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     05     図5-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">出来事は動かず、意味が動く</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">過去の出来事と現在のあいだを往復する二本の矢印と、同じ出来事に付く二つの意味の札を見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="130.0" y="250.0" width="300.0" height="110.0" rx="14" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="280.0" y="301.0" fill="#8a4f9e" font-size="22" text-anchor="middle" font-weight="700">過去の出来事</text>
<text x="280.0" y="331.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">ある人との出会い</text>
<rect x="770.0" y="250.0" width="300.0" height="110.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="920.0" y="301.0" fill="#c7792b" font-size="22" text-anchor="middle" font-weight="700">現在</text>
<text x="920.0" y="331.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">人生を変えた相手</text>
<line x1="444.0" y1="282.0" x2="756.0" y2="282.0" stroke="#2f8f83" stroke-width="2.4" marker-end="url(#arrow-2f8f83)"/>
<text x="600.0" y="268.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">形づくる（因果）</text>
<line x1="756.0" y1="332.0" x2="444.0" y2="332.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-2b5f9e)" stroke-dasharray="8 7"/>
<text x="600.0" y="356.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">意味づける（解釈）</text>
<rect x="130.0" y="400.0" width="212.0" height="42.0" rx="8" fill="#ffffff" stroke="#2b5f9e" stroke-width="1.6"/>
<text x="236.0" y="426.8" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="700">当時：数ある知人の一人</text>
<line x1="356.0" y1="421.0" x2="404.0" y2="421.0" stroke="#2b5f9e" stroke-width="1.8" marker-end="url(#arrow-2b5f9e)" stroke-dasharray="8 7"/>
<rect x="418.0" y="400.0" width="130.0" height="42.0" rx="8" fill="#ffffff" stroke="#2b5f9e" stroke-width="1.6"/>
<text x="483.0" y="426.8" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="700">十年後：転機</text>
<text x="600.0" y="508.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">出来事は動かない。意味は変わる</text>
</g>
</svg>
