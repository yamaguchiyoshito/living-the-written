<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">「道」は時間の外にある</title>
<desc id="desc">過去から未来へ並ぶ人物や出来事の列と、その順序の外で全員を結ぶ「道」の面を見る。</desc>
<defs><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="700" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     02     図2-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「道」は時間の外にある</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">過去から未来へ並ぶ人物や出来事の列と、その順序の外で全員を結ぶ「道」の面を見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<path d="M 250 235 L 1030 205 L 950 395 L 170 425 Z" fill="#8a4f9e" stroke="#8a4f9e" stroke-width="2" opacity="0.1"/>
<path d="M 250 235 L 1030 205 L 950 395 L 170 425 Z" fill="none" stroke="#8a4f9e" stroke-width="2"/>
<text x="300.0" y="270.0" fill="#8a4f9e" font-size="20" text-anchor="start" font-weight="700">「道」　時間の秩序の外</text>
<text x="60.0" y="318.0" fill="#8a4f9e" font-size="15" text-anchor="start" font-weight="400">時間の外</text>
<text x="60.0" y="342.0" fill="#8a4f9e" font-size="15" text-anchor="start" font-weight="400">相互に結ぶ</text>
<line x1="300.0" y1="335.0" x2="430.0" y2="305.0" stroke="#8a4f9e" stroke-width="1.6" opacity="0.5"/>
