<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">完成が残すものと終わらせるもの</title>
<desc id="desc">百夜の積み重ねが完成の線で切れ、作品は右へ残り、描く行為はそこで止まることを見る。</desc>
<defs><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     08     図8-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">完成が残すものと終わらせるもの</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">百夜の積み重ねが完成の線で切れ、作品は右へ残り、描く行為はそこで止まることを見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="90.0" y="282.0" fill="#2f8f83" font-size="16" text-anchor="start" font-weight="700">描いている（未完了相）</text>
<rect x="90.0" y="300.0" width="488.0" height="36.0" rx="6" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.28"/>
<text x="102.0" y="324.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">百夜目</text>
<rect x="90.0" y="348.0" width="340.0" height="36.0" rx="6" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.14"/>
<text x="102.0" y="372.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">…</text>
<rect x="90.0" y="396.0" width="220.0" height="36.0" rx="6" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.28"/>
<text x="102.0" y="420.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">二夜目</text>
<rect x="90.0" y="444.0" width="110.0" height="36.0" rx="6" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.28"/>
<text x="102.0" y="468.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">一夜目</text>
<text x="325.0" y="514.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">持続：前の夜を含む</text>
<line x1="580.0" y1="250.0" x2="580.0" y2="530.0" stroke="#c7792b" stroke-width="3"/>
<text x="580.0" y="236.0" fill="#c7792b" font-size="18" text-anchor="middle" font-weight="700">描き終える</text>
<line x1="586.0" y1="318.0" x2="652.0" y2="318.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow-5d6873)"/>
<text x="760.0" y="266.0" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="700">残る</text>
<rect x="660.0" y="282.0" width="200.0" height="70.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="760.0" y="325.0" fill="#2b5f9e" font-size="21" text-anchor="middle" font-weight="700">完成した絵</text>
<line x1="866.0" y1="304.0" x2="990.0" y2="304.0" stroke="#2b5f9e" stroke-width="2" marker-end="url(#arrow-2b5f9e)"/>
<line x1="866.0" y1="332.0" x2="990.0" y2="332.0" stroke="#2b5f9e" stroke-width="2" marker-end="url(#arrow-2b5f9e)"/>
<text x="1000.0" y="309.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">鑑賞者が見る</text>
<text x="1000.0" y="337.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">次の制作へ</text>
<path d="M 586 336 Q 600 462 648 462" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<rect x="660.0" y="428.0" width="240.0" height="68.0" rx="10" fill="none" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="8 7"/>
<text x="780.0" y="468.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">百夜は戻らない</text>
</g>
</svg>
