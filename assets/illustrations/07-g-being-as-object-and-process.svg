<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">対象としての存在と、過程としての存在</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">完成して保持される対象と、行為が続く間にだけ変化し続ける関係という、存在の二つの形式を見る。</text>
