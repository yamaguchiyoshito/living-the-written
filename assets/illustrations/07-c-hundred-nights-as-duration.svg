<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">百夜は、百個の夜ではない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">同じ百夜を、数えられる単位の列として見る場合と、過去を含んで厚くなる一つの流れとして見る場合を見る。</text>
