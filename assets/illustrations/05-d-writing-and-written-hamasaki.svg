<title id="title">書く浜崎正が、書かれる浜崎正を生む</title>
<desc id="desc">上は出来事から記述へ進む一方向の列、下は書く現在の浜崎正と小説の中に立つ二十歳の浜崎正が互いを成立させる輪を見る。</desc>
