<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">日付は動かず、意味だけが動く</title>
<desc id="desc">歴史の一点に固定された出会いが、二人の人生の線では異なる位置に置かれ、後の出来事から意味が書き換わる構造を見る。</desc>
<defs><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-8a4f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a4f9e" stroke-width="1.4"/></marker><marker id="arrow-2f8f83" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     04     図4-7</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">日付は動かず、意味だけが動く</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">歴史の一点に固定された出会いが、二人の人生の線では異なる位置に置かれ、後の出来事から意味が書き換わる構造を見る。</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="120.0" y="248.0" fill="#2b5f9e" font-size="19" text-anchor="start" font-weight="700">歴史の日付</text>
<line x1="120.0" y1="260.0" x2="1000.0" y2="260.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-2b5f9e)"/>
<text x="560.0" y="240.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">同じ出会い：日付は動かない</text>
<line x1="560.0" y1="270.0" x2="800.0" y2="390.0" stroke="#5d6873" stroke-width="1.6" stroke-dasharray="8 7"/>
<line x1="560.0" y1="270.0" x2="320.0" y2="530.0" stroke="#5d6873" stroke-width="1.6" stroke-dasharray="8 7"/>
<text x="120.0" y="388.0" fill="#8a4f9e" font-size="19" text-anchor="start" font-weight="700">エマノンの人生</text>
<rect x="150.0" y="392.0" width="635.0" height="16.0" rx="8" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.2"/>
<line x1="120.0" y1="400.0" x2="1000.0" y2="400.0" stroke="#8a4f9e" stroke-width="2.4" marker-end="url(#arrow-8a4f9e)"/>
<text x="300.0" y="385.0" fill="#8a4f9e" font-size="17" text-anchor="middle" font-weight="700">長い孤独</text>
<text x="300.0" y="432.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">過去の記憶として</text>
<text x="800.0" y="432.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">出会い</text>
<text x="120.0" y="528.0" fill="#2f8f83" font-size="19" text-anchor="start" font-weight="700">ヒカリの人生</text>
<line x1="120.0" y1="540.0" x2="1000.0" y2="540.0" stroke="#2f8f83" stroke-width="2.4" marker-end="url(#arrow-2f8f83)"/>
<text x="296.0" y="568.0" fill="#232a33" font-size="15" text-anchor="end" font-weight="400">出会い</text>
<circle cx="600.0" cy="540.0" r="7" fill="#2f8f83"/>
<circle cx="760.0" cy="540.0" r="7" fill="#2f8f83"/>
<text x="680.0" y="525.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">後の出来事</text>
<text x="680.0" y="572.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">未来の経験として</text>
<path d="M 586 556 Q 460 612 338 554" fill="none" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow-8a4f9e)" stroke-dasharray="8 7"/>
<text x="470.0" y="618.0" fill="#8a4f9e" font-size="16" text-anchor="middle" font-weight="700">後の出来事が意味を変える</text>
<circle cx="560.0" cy="260.0" r="9" fill="#ffffff"/>
<circle cx="560.0" cy="260.0" r="9" fill="none" stroke="#2b5f9e" stroke-width="3"/>
<circle cx="800.0" cy="400.0" r="9" fill="#ffffff"/>
<circle cx="800.0" cy="400.0" r="9" fill="none" stroke="#8a4f9e" stroke-width="3"/>
<circle cx="320.0" cy="540.0" r="9" fill="#ffffff"/>
<circle cx="320.0" cy="540.0" r="9" fill="none" stroke="#2f8f83" stroke-width="3"/>
<text x="1150.0" y="470.0" fill="#232a33" font-size="17" text-anchor="end" font-weight="700">時間的位置≠意味的位置</text>
</g>
</svg>
