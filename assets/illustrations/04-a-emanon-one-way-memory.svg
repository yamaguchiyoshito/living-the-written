<rect x="790.0" y="310.0" width="330.0" height="60.0" rx="10" fill="none" stroke="#2f8f83" stroke-width="2" stroke-dasharray="8 7"/>
<text x="955.0" y="347.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="400">まだ経験していない未来</text>
