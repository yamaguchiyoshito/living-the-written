<text x="136.0" y="235.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">人間の記憶：数十年</text>
<text x="760.0" y="262.0" fill="#c7792b" font-size="19" text-anchor="middle" font-weight="700">いま</text>
<line x1="760.0" y1="272.0" x2="760.0" y2="462.0" stroke="#c7792b" stroke-width="3"/>
<text x="100.0" y="298.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">受け継がれた記憶</text>
