<text x="50.0" y="52.0" fill="#8a4f9e" font-size="18" text-anchor="start" font-weight="700">LIVING THE WRITTEN     04     図4-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">30億年の記憶は一方向に積み重なる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">人間の記憶との長さの違いと、記憶が一方向にだけ積み重なって過去へ戻れない構造を見る。</text>
